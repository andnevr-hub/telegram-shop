<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChiSetupShop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg: #fafaf9;
  --bg2: #ffffff;
  --bg3: #e7e5e4;
  --accent: #1c1917;
  --accent2: #44403c;
  --text: #1c1917;
  --text2: #78716c;
  --text3: #a8a29e;
  --green: #10b981;
  --red: #ef4444;
  --card-r: 20px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
}
body.dark {
  --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #2a2a2a;
  --accent: #f5f5f5; --accent2: #d4d4d4;
  --text: #f5f5f5; --text2: #a3a3a3; --text3: #6b6b6b;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding-bottom: 80px;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
  transition: background .3s, color .3s;
}

/* NAV */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg2); border-top: 0.5px solid var(--bg3);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 4px; padding: 10px 0 8px;
  cursor: pointer; font-size: 11px; font-weight: 500;
  color: var(--text3); border: none; background: none; font-family: inherit;
}
.nav-btn.active { color: var(--accent); font-weight: 700; }
.nav-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }
.cart-badge {
  position: absolute; top: -5px; right: -8px;
  background: var(--accent); color: var(--bg);
  font-size: 9px; font-weight: 800; width: 17px; height: 17px;
  border-radius: 50%; display: none; align-items: center; justify-content: center;
}

/* PAGES */
.page { display: none; animation: fadeIn .25s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

/* HEADER */
.page-header {
  padding: 24px 20px 12px;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; background: var(--bg); z-index: 50;
}
.page-back {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg2); border: 0.5px solid var(--bg3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text); font-size: 18px; flex-shrink: 0;
}
.page-title { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }

/* THEME BTN */
.theme-btn {
  position: fixed; top: 20px; right: 20px;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg2); border: 0.5px solid var(--bg3);
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 200;
}

/* SEARCH + CATS */
.search-wrap { padding: 4px 20px 14px; }
.search-input {
  width: 100%; background: var(--bg2); border: 0.5px solid var(--bg3);
  border-radius: 14px; padding: 13px 18px; color: var(--text);
  font-size: 15px; outline: none; font-family: inherit;
  box-shadow: var(--shadow-sm);
}
.search-input:focus { border-color: var(--accent2); }
.search-input::placeholder { color: var(--text3); }
.cats {
  display: flex; gap: 8px; padding: 0 20px 16px;
  overflow-x: auto; scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cat-btn {
  flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  border: 0.5px solid var(--bg3); background: var(--bg2);
  color: var(--text2); font-family: inherit; white-space: nowrap;
}
.cat-btn.active {
  background: var(--accent); border-color: var(--accent);
  color: var(--bg); font-weight: 700;
}

/* PRODUCTS */
.products-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px; padding: 0 20px;
}
.product-card {
  background: var(--bg2); border-radius: var(--card-r);
  overflow: hidden; cursor: pointer;
  border: 0.5px solid var(--bg3); box-shadow: var(--shadow-sm);
  transition: transform .15s, box-shadow .15s;
}
.product-card:active { transform: scale(0.97); }
.product-img {
  width: 100%; aspect-ratio: 1; background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 52px; position: relative; overflow: hidden;
}
.product-img img {
  width: 100%; height: 100%; object-fit: cover;
  position: absolute; top: 0; left: 0;
}
.stock-badge {
  position: absolute; top: 8px; left: 8px;
  font-size: 10px; font-weight: 700; padding: 3px 9px;
  border-radius: 20px; z-index: 2;
  backdrop-filter: blur(8px);
}
.stock-badge.in { background: rgba(16,185,129,.15); color: #059669; }
.stock-badge.out { background: rgba(239,68,68,.15); color: #dc2626; }
.product-info { padding: 11px 12px 13px; }
.product-name {
  font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 5px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.product-price { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
.add-btn {
  margin-top: 9px; width: 100%; background: var(--accent);
  border: none; border-radius: 11px; color: var(--bg);
  font-size: 13px; font-weight: 600; padding: 9px;
  cursor: pointer; font-family: inherit;
}
.add-btn.disabled { background: var(--bg3); color: var(--text3); pointer-events: none; }

/* DETAIL */
.detail-img {
  width: 100%; aspect-ratio: 1; background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 100px; position: relative; overflow: hidden;
}
.detail-img img { width: 100%; height: 100%; object-fit: cover; }
.detail-body { padding: 22px 20px 32px; }
.detail-name { font-size: 22px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.02em; }
.detail-price { font-size: 30px; font-weight: 800; margin-bottom: 16px; letter-spacing: -.03em; }
.detail-desc { font-size: 15px; color: var(--text2); line-height: 1.7; margin-bottom: 20px; }
.detail-specs {
  background: var(--bg2); border-radius: 16px;
  padding: 14px 16px; margin-bottom: 20px;
  border: 0.5px solid var(--bg3);
}
.spec-row {
  display: flex; justify-content: space-between;
  font-size: 14px; padding: 7px 0;
  border-bottom: 0.5px solid var(--bg3);
}
.spec-row:last-child { border: none; }
.spec-label { color: var(--text2); }
.spec-val { font-weight: 600; }
.detail-add-btn {
  width: 100%; background: var(--accent); border: none;
  border-radius: 16px; color: var(--bg); font-size: 16px;
  font-weight: 700; padding: 16px; cursor: pointer; font-family: inherit;
  box-shadow: 0 4px 16px rgba(28,25,23,.15);
}
.detail-add-btn.disabled { background: var(--bg3); color: var(--text3); pointer-events: none; box-shadow: none; }

/* CART */
.cart-empty {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 80px 24px; text-align: center; gap: 12px;
}
.cart-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
.cart-item {
  background: var(--bg2); border-radius: var(--card-r);
  padding: 14px; display: flex; align-items: center; gap: 12px;
  border: 0.5px solid var(--bg3);
}
.cart-item-icon {
  width: 56px; height: 56px; border-radius: 14px;
  background: var(--bg3); display: flex; align-items: center;
  justify-content: center; font-size: 32px; flex-shrink: 0; overflow: hidden;
}
.cart-item-icon img { width: 100%; height: 100%; object-fit: cover; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart-item-price { font-size: 15px; font-weight: 800; }
.cart-item-qty { display: flex; align-items: center; gap: 10px; margin-top: 7px; }
.qty-btn {
  width: 28px; height: 28px; border-radius: 9px;
  background: var(--bg3); border: none; color: var(--text);
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.qty-num { font-size: 15px; font-weight: 700; min-width: 20px; text-align: center; }
.remove-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 18px; padding: 6px; }
.cart-footer { padding: 16px 20px; }
.cart-total {
  background: var(--bg2); border-radius: var(--card-r);
  padding: 15px 18px; margin-bottom: 14px; border: 0.5px solid var(--bg3);
}
.cart-total-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; color: var(--text2); }
.cart-total-row.total { font-size: 17px; font-weight: 800; color: var(--text); border-top: 0.5px solid var(--bg3); margin-top: 10px; padding-top: 13px; }
.checkout-btn {
  width: 100%; padding: 16px; background: var(--accent);
  border: none; border-radius: 16px; color: var(--bg);
  font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
}

/* CHECKOUT */
.checkout-steps { display: flex; align-items: center; padding: 6px 20px 22px; }
.step-item { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.step-circle {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  background: var(--bg3); color: var(--text3);
}
.step-circle.active { background: var(--accent); color: var(--bg); }
.step-circle.done { background: var(--green); color: #fff; }
.step-label { font-size: 10px; color: var(--text3); font-weight: 500; }
.step-label.active { color: var(--accent); font-weight: 700; }
.step-line { flex: 1; height: 1px; background: var(--bg3); margin: 0 4px 16px; }
.checkout-form { padding: 0 20px; display: flex; flex-direction: column; gap: 13px; }
.form-label { font-size: 12px; color: var(--text2); margin-bottom: -7px; padding-left: 2px; font-weight: 500; }
.form-input {
  width: 100%; background: var(--bg2); border: 0.5px solid var(--bg3);
  border-radius: 14px; padding: 14px 16px; color: var(--text);
  font-size: 15px; outline: none; font-family: inherit;
}
.form-input:focus { border-color: var(--accent2); }
.form-input::placeholder { color: var(--text3); }
.delivery-option {
  background: var(--bg2); border: 0.5px solid var(--bg3);
  border-radius: var(--card-r); padding: 15px 16px;
  cursor: pointer; display: flex; align-items: center; gap: 13px;
}
.delivery-option.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.delivery-opt-icon { font-size: 24px; }
.delivery-opt-info { flex: 1; }
.delivery-opt-name { font-size: 15px; font-weight: 600; }
.delivery-opt-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--bg3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.radio.checked { border-color: var(--accent); background: var(--accent); }
.radio.checked::after { content:''; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); }
.next-btn {
  width: 100%; padding: 16px; background: var(--accent);
  border: none; border-radius: 16px; color: var(--bg);
  font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px;
}

/* SUCCESS */
.success-page {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 60vh; padding: 40px 24px;
  text-align: center; gap: 16px;
}
.success-icon { font-size: 72px; animation: pop .5s cubic-bezier(.175,.885,.32,1.275); }
@keyframes pop { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
.success-title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.success-desc { font-size: 15px; color: var(--text2); line-height: 1.7; }
.success-btn {
  padding: 14px 32px; background: var(--accent); border: none;
  border-radius: 16px; color: var(--bg); font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: inherit; margin-top: 8px;
}

/* ACCOUNT */
.account-card {
  background: var(--bg2); border-radius: var(--card-r);
  padding: 18px; display: flex; align-items: center; gap: 16px;
  border: 0.5px solid var(--bg3); margin-bottom: 24px;
}
.account-avatar {
  width: 52px; height: 52px; border-radius: 50%; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: var(--bg); flex-shrink: 0;
}
.order-card {
  background: var(--bg2); border-radius: var(--card-r);
  padding: 16px 18px; margin-bottom: 10px; border: 0.5px solid var(--bg3);
}

/* TOAST */
.toast {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: #1c1917; color: #fff;
  padding: 11px 22px; border-radius: 30px;
  font-size: 13px; font-weight: 600;
  transition: transform .3s cubic-bezier(.175,.885,.32,1.275);
  z-index: 999; white-space: nowrap; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* SKELETON */
.skeleton {
  background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: 10px;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* EMPTY */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text3);
}
.empty-state .icon { font-size: 56px; margin-bottom: 12px; }
.empty-state h3 { font-size: 18px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.empty-state p { font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<button class="theme-btn" id="theme-btn">🌙</button>
<div class="toast" id="toast"></div>

<!-- SHOP -->
<div class="page active" id="page-shop">
  <div class="page-header"><span class="page-title">Магазин</span></div>
  <div class="search-wrap">
    <input class="search-input" type="text" id="search-input" placeholder="Пошук товарів…" oninput="filterProducts()">
  </div>
  <div class="cats" id="cats"></div>
  <div class="products-grid" id="products-grid">
    <!-- skeleton -->
    <div style="background:var(--bg2);border-radius:20px;overflow:hidden;border:.5px solid var(--bg3);">
      <div class="skeleton" style="aspect-ratio:1;width:100%"></div>
      <div style="padding:12px"><div class="skeleton" style="height:14px;margin-bottom:8px"></div><div class="skeleton" style="height:18px;width:60%"></div></div>
    </div>
    <div style="background:var(--bg2);border-radius:20px;overflow:hidden;border:.5px solid var(--bg3);">
      <div class="skeleton" style="aspect-ratio:1;width:100%"></div>
      <div style="padding:12px"><div class="skeleton" style="height:14px;margin-bottom:8px"></div><div class="skeleton" style="height:18px;width:60%"></div></div>
    </div>
  </div>
</div>

<!-- DETAIL -->
<div class="page" id="page-detail">
  <div class="page-header">
    <button class="page-back" onclick="goBack()">←</button>
    <span class="page-title" id="detail-header"></span>
  </div>
  <div class="detail-img" id="detail-img"></div>
  <div class="detail-body">
    <div class="detail-name" id="detail-name"></div>
    <div class="detail-price" id="detail-price"></div>
    <div class="detail-desc" id="detail-desc"></div>
    <div class="detail-specs" id="detail-specs"></div>
    <button class="detail-add-btn" id="detail-add-btn" onclick="addFromDetail()">Додати в кошик</button>
  </div>
</div>

<!-- CART -->
<div class="page" id="page-cart">
  <div class="page-header"><span class="page-title">Кошик</span></div>
  <div id="cart-content"></div>
</div>

<!-- CHECKOUT -->
<div class="page" id="page-checkout">
  <div class="page-header">
    <button class="page-back" onclick="showPage('cart')">←</button>
    <span class="page-title">Оформлення</span>
  </div>
  <div class="checkout-steps">
    <div class="step-item"><div class="step-circle active" id="step1">1</div><div class="step-label active">Контакти</div></div>
    <div class="step-line"></div>
    <div class="step-item"><div class="step-circle" id="step2">2</div><div class="step-label">Доставка</div></div>
    <div class="step-line"></div>
    <div class="step-item"><div class="step-circle" id="step3">3</div><div class="step-label">Оплата</div></div>
    <div class="step-line"></div>
    <div class="step-item"><div class="step-circle" id="step4">4</div><div class="step-label">Готово</div></div>
  </div>
  <div id="checkout-body"></div>
</div>

<!-- ACCOUNT -->
<div class="page" id="page-account">
  <div class="page-header"><span class="page-title">Акаунт</span></div>
  <div style="padding:0 20px">
    <div class="account-card">
      <div class="account-avatar" id="account-avatar">А</div>
      <div>
        <div style="font-size:17px;font-weight:700" id="account-name">Гість</div>
        <div style="font-size:13px;color:var(--text2)" id="account-username">@username</div>
      </div>
    </div>
    <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px">Мої замовлення</div>
    <div id="orders-list">
      <div class="empty-state"><div class="icon">📦</div><h3>Замовлень немає</h3><p>Оформіть перше замовлення і воно з'явиться тут</p></div>
    </div>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" id="nav-shop" onclick="showPage('shop')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Магазин
  </button>
  <button class="nav-btn" id="nav-cart" onclick="showPage('cart')">
    <div style="position:relative">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      <div class="cart-badge" id="cart-badge">0</div>
    </div>
    Кошик
  </button>
  <button class="nav-btn" id="nav-account" onclick="showPage('account')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Акаунт
  </button>
</nav>

<script>
// ── CONFIG ──
// Якщо відкривається не через Telegram, підставляємо поточний origin
const API = window.location.origin;

const CATS = [
  { id:'all', label:'Все' },
  { id:'mice', label:'🖱 Мишки' },
  { id:'keyboards', label:'⌨️ Клави' },
  { id:'headphones', label:'🎧 Навушники' },
  { id:'pads', label:'🎯 Килимки' },
];

let products = [];
let currentCat = 'all';
let currentPage = 'shop';
let prevPage = 'shop';
let currentProduct = null;
let cart = {};
let checkoutStep = 1;
let checkoutData = {};
let orders = [];

// ── THEME ──
const themeBtn = document.getElementById('theme-btn');
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  themeBtn.textContent = '☀️';
}
themeBtn.onclick = () => {
  document.body.classList.toggle('dark');
  const dark = document.body.classList.contains('dark');
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  themeBtn.textContent = dark ? '☀️' : '🌙';
};

// ── INIT ──
window.onload = async () => {
  if (window.Telegram?.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.expand();
    const u = tg.initDataUnsafe?.user;
    if (u) {
      document.getElementById('account-name').textContent = u.first_name + (u.last_name ? ' ' + u.last_name : '');
      document.getElementById('account-username').textContent = '@' + (u.username || 'username');
      document.getElementById('account-avatar').textContent = u.first_name[0];
    }
  }
  renderCats();
  await loadProducts();
};

// ── LOAD PRODUCTS ──
async function loadProducts() {
  try {
    const res = await fetch(`${API}/api/products`);
    products = await res.json();
    renderProducts();
  } catch(e) {
    document.getElementById('products-grid').innerHTML = `
      <div style="grid-column:1/-1" class="empty-state">
        <div class="icon">⚠️</div>
        <h3>Помилка завантаження</h3>
        <p>Перевір підключення до інтернету</p>
      </div>`;
  }
}

// ── NAVIGATION ──
function showPage(name) {
  prevPage = currentPage;
  currentPage = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const navMap = { shop:'nav-shop', cart:'nav-cart', account:'nav-account' };
  if (navMap[name]) document.getElementById(navMap[name]).classList.add('active');
  if (name === 'cart') renderCart();
  if (name === 'account') renderOrders();
  window.scrollTo(0, 0);
}

function goBack() {
  showPage(prevPage === 'cart' ? 'shop' : (prevPage || 'shop'));
}

// ── CATEGORIES ──
function renderCats() {
  document.getElementById('cats').innerHTML = CATS.map(c => `
    <button class="cat-btn ${c.id === currentCat ? 'active' : ''}" onclick="selectCat('${c.id}')">${c.label}</button>
  `).join('');
}
function selectCat(id) {
  currentCat = id;
  renderCats();
  renderProducts();
}

// ── PRODUCTS ──
function imgTag(photo, emoji, cls) {
  if (photo) return `<img src="${API}${photo}" alt="" loading="lazy">`;
  return `<span style="font-size:${cls === 'detail' ? '90px' : '46px'}">${emoji || '📦'}</span>`;
}

function emojiForCat(cat) {
  const m = { mice:'🖱️', keyboards:'⌨️', headphones:'🎧', pads:'🎯' };
  return m[cat] || '📦';
}

function renderProducts() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const grid = document.getElementById('products-grid');
  const filtered = products.filter(p =>
    (currentCat === 'all' || p.category === currentCat) &&
    p.name.toLowerCase().includes(q)
  );
  if (!filtered.length) {
    grid.innerHTML = `<div style="grid-column:1/-1" class="empty-state"><div class="icon">🔍</div><h3>Нічого не знайдено</h3></div>`;
    return;
  }
  grid.innerHTML = filtered.map(p => `
    <div class="product-card" onclick="openProduct(${p.id})">
      <div class="product-img">
        ${imgTag(p.photo, emojiForCat(p.category))}
        <span class="stock-badge ${p.stock > 0 ? 'in' : 'out'}">${p.stock > 0 ? 'В наявності' : 'Немає'}</span>
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">${Number(p.price).toLocaleString()} ₴</div>
        <button class="add-btn ${p.stock === 0 ? 'disabled' : ''}" onclick="event.stopPropagation();addToCart(${p.id})">В кошик</button>
      </div>
    </div>
  `).join('');
}

function filterProducts() { renderProducts(); }

// ── DETAIL ──
function openProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  currentProduct = p;
  prevPage = currentPage;
  document.getElementById('detail-header').textContent = p.name;
  const specs = typeof p.specs === 'string' ? JSON.parse(p.specs) : (p.specs || []);
  document.getElementById('detail-img').innerHTML = imgTag(p.photo, emojiForCat(p.category), 'detail');
  document.getElementById('detail-name').textContent = p.name;
  document.getElementById('detail-price').textContent = Number(p.price).toLocaleString() + ' ₴';
  document.getElementById('detail-desc').textContent = p.description || '';
  document.getElementById('detail-specs').innerHTML = specs.map(([l,v]) => `
    <div class="spec-row"><span class="spec-label">${l}</span><span class="spec-val">${v}</span></div>
  `).join('') || '';
  const btn = document.getElementById('detail-add-btn');
  btn.className = 'detail-add-btn' + (p.stock === 0 ? ' disabled' : '');
  btn.textContent = p.stock > 0 ? 'Додати в кошик' : 'Немає в наявності';
  showPage('detail');
}

function addFromDetail() {
  if (!currentProduct || currentProduct.stock === 0) return;
  addToCart(currentProduct.id);
}

// ── CART ──
function addToCart(id) {
  const p = products.find(x => x.id === id);
  if (!p || p.stock === 0) return;
  if (cart[id]) cart[id].qty = Math.min(cart[id].qty + 1, p.stock);
  else cart[id] = { product: p, qty: 1 };
  updateBadge();
  showToast('✓ Додано до кошика');
  if (window.Telegram?.WebApp?.HapticFeedback) {
    window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
  }
}

function removeFromCart(id) { delete cart[id]; updateBadge(); renderCart(); }
function changeQty(id, d) {
  if (!cart[id]) return;
  cart[id].qty += d;
  if (cart[id].qty <= 0) delete cart[id];
  updateBadge(); renderCart();
}
function updateBadge() {
  const n = Object.values(cart).reduce((s,i) => s+i.qty, 0);
  const b = document.getElementById('cart-badge');
  b.textContent = n; b.style.display = n > 0 ? 'flex' : 'none';
}
function cartTotal() {
  return Object.values(cart).reduce((s,i) => s + i.product.price * i.qty, 0);
}

function renderCart() {
  const el = document.getElementById('cart-content');
  const items = Object.values(cart);
  if (!items.length) {
    el.innerHTML = `<div class="cart-empty empty-state">
      <div class="icon">🛒</div>
      <h3>Кошик порожній</h3>
      <p>Додайте товари з каталогу</p>
      <button onclick="showPage('shop')" style="margin-top:16px;padding:13px 28px;background:var(--accent);border:none;border-radius:14px;color:var(--bg);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">В каталог</button>
    </div>`;
    return;
  }
  const list = items.map(i => `
    <div class="cart-item">
      <div class="cart-item-icon">${imgTag(i.product.photo, emojiForCat(i.product.category))}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${i.product.name}</div>
        <div class="cart-item-price">${(i.product.price * i.qty).toLocaleString()} ₴</div>
        <div class="cart-item-qty">
          <button class="qty-btn" onclick="changeQty(${i.product.id},-1)">−</button>
          <span class="qty-num">${i.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i.product.id},1)">+</button>
        </div>
      </div>
      <button class="remove-btn" onclick="removeFromCart(${i.product.id})">🗑</button>
    </div>
  `).join('');
  const total = cartTotal();
  el.innerHTML = `
    <div class="cart-list">${list}</div>
    <div class="cart-footer">
      <div class="cart-total">
        <div class="cart-total-row"><span>Товари (${items.length})</span><span>${total.toLocaleString()} ₴</span></div>
        <div class="cart-total-row"><span>Доставка</span><span>за тарифом НП</span></div>
        <div class="cart-total-row total"><span>Разом</span><span>${total.toLocaleString()} ₴</span></div>
      </div>
      <button class="checkout-btn" onclick="startCheckout()">Оформити замовлення →</button>
    </div>`;
}

// ── CHECKOUT ──
function startCheckout() {
  checkoutStep = 1; checkoutData = {};
  showPage('checkout'); renderCheckoutStep();
}
function setStep(n) {
  for (let i=1;i<=4;i++) {
    const c = document.getElementById('step'+i);
    c.className = 'step-circle' + (i<n?' done':i===n?' active':'');
  }
  document.querySelectorAll('.step-label').forEach((l,i) => {
    l.className = 'step-label' + (i+1===n?' active':'');
  });
}
function renderCheckoutStep() {
  setStep(checkoutStep);
  const el = document.getElementById('checkout-body');
  if (checkoutStep === 1) {
    el.innerHTML = `<div class="checkout-form">
      <div class="form-label">Ім'я та прізвище</div>
      <input class="form-input" id="inp-name" placeholder="Іван Іваненко" value="${checkoutData.name||''}">
      <div class="form-label">Номер телефону</div>
      <input class="form-input" id="inp-phone" placeholder="+380 00 000 0000" type="tel" value="${checkoutData.phone||''}">
      <button class="next-btn" onclick="nextStep1()">Далі →</button>
    </div>`;
  } else if (checkoutStep === 2) {
    el.innerHTML = `<div class="checkout-form">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="delivery-option ${checkoutData.delivery==='np'?'selected':''}" onclick="selectDelivery('np')">
          <div class="delivery-opt-icon">📦</div>
          <div class="delivery-opt-info"><div class="delivery-opt-name">Nova Poshta</div><div class="delivery-opt-desc">По всій Україні, 1-3 дні</div></div>
          <div class="radio ${checkoutData.delivery==='np'?'checked':''}"></div>
        </div>
        <div class="delivery-option ${checkoutData.delivery==='pickup'?'selected':''}" onclick="selectDelivery('pickup')">
          <div class="delivery-opt-icon">🏠</div>
          <div class="delivery-opt-info"><div class="delivery-opt-name">Самовивіз</div><div class="delivery-opt-desc">Київ, уточнення при замовленні</div></div>
          <div class="radio ${checkoutData.delivery==='pickup'?'checked':''}"></div>
        </div>
      </div>
      ${checkoutData.delivery==='np'?`
        <div class="form-label">Місто</div>
        <input class="form-input" id="inp-city" placeholder="Київ" value="${checkoutData.city||''}">
        <div class="form-label">Відділення або поштомат</div>
        <input class="form-input" id="inp-branch" placeholder="Відділення №1" value="${checkoutData.branch||''}">
      `:''}
      <button class="next-btn" onclick="nextStep2()">Далі →</button>
    </div>`;
  } else if (checkoutStep === 3) {
    el.innerHTML = `<div class="checkout-form">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="delivery-option ${checkoutData.payment==='card'?'selected':''}" onclick="selectPayment('card')">
          <div class="delivery-opt-icon">💳</div>
          <div class="delivery-opt-info"><div class="delivery-opt-name">Карта (передоплата)</div><div class="delivery-opt-desc">PrivatBank / Monobank</div></div>
          <div class="radio ${checkoutData.payment==='card'?'checked':''}"></div>
        </div>
        <div class="delivery-option ${checkoutData.payment==='cod'?'selected':''}" onclick="selectPayment('cod')">
          <div class="delivery-opt-icon">📬</div>
          <div class="delivery-opt-info"><div class="delivery-opt-name">Накладений платіж</div><div class="delivery-opt-desc">+2% комісія НП при отриманні</div></div>
          <div class="radio ${checkoutData.payment==='cod'?'checked':''}"></div>
        </div>
      </div>
      <button class="next-btn" onclick="nextStep3()">Підтвердити замовлення ✓</button>
    </div>`;
  } else if (checkoutStep === 4) {
    placeOrder();
  }
}

async function placeOrder() {
  const items = Object.values(cart).map(i => ({
    id: i.product.id,
    name: i.product.name,
    price: i.product.price,
    qty: i.qty
  }));
  try {
    const res = await fetch(`${API}/api/orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: checkoutData.name,
        phone: checkoutData.phone,
        delivery: checkoutData.delivery,
        city: checkoutData.city,
        branch: checkoutData.branch,
        payment: checkoutData.payment,
        items,
        total: cartTotal()
      })
    });
    const data = await res.json();
    if (!data.success) throw new Error();

    const orderNum = data.orderNum;
    orders.unshift({ num: orderNum, items: Object.values(cart), total: cartTotal(), date: new Date() });
    cart = {};
    updateBadge();

    setStep(4);
    document.getElementById('checkout-body').innerHTML = `
      <div class="success-page">
        <div class="success-icon">✅</div>
        <div class="success-title">Замовлення оформлено!</div>
        <div class="success-desc">Номер: <strong>${orderNum}</strong><br><br>Менеджер зв'яжеться з вами найближчим часом для підтвердження.</div>
        <button class="success-btn" onclick="showPage('shop')">Продовжити покупки</button>
      </div>`;

    if (window.Telegram?.WebApp?.HapticFeedback) {
      window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
    }
  } catch(e) {
    showToast('❌ Помилка. Спробуй ще раз');
    checkoutStep = 3;
    renderCheckoutStep();
  }
}

function nextStep1() {
  const name = document.getElementById('inp-name').value.trim();
  const phone = document.getElementById('inp-phone').value.trim();
  if (!name || !phone) { showToast('Заповніть всі поля'); return; }
  checkoutData.name = name; checkoutData.phone = phone;
  checkoutStep = 2; renderCheckoutStep();
}
function nextStep2() {
  if (!checkoutData.delivery) { showToast('Оберіть спосіб доставки'); return; }
  if (checkoutData.delivery === 'np') {
    checkoutData.city = document.getElementById('inp-city')?.value.trim();
    checkoutData.branch = document.getElementById('inp-branch')?.value.trim();
    if (!checkoutData.city || !checkoutData.branch) { showToast('Вкажіть місто і відділення'); return; }
  }
  checkoutStep = 3; renderCheckoutStep();
}
function nextStep3() {
  if (!checkoutData.payment) { showToast('Оберіть спосіб оплати'); return; }
  checkoutStep = 4; renderCheckoutStep();
}
function selectDelivery(t) { checkoutData.delivery = t; renderCheckoutStep(); }
function selectPayment(t) { checkoutData.payment = t; renderCheckoutStep(); }

// ── ORDERS ──
function renderOrders() {
  const el = document.getElementById('orders-list');
  if (!orders.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📦</div><h3>Замовлень немає</h3><p>Оформіть перше замовлення</p></div>`;
    return;
  }
  el.innerHTML = orders.map(o => `
    <div class="order-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-weight:700">${o.num}</span>
        <span style="font-size:12px;color:var(--green);font-weight:600">✓ Оформлено</span>
      </div>
      <div style="font-size:13px;color:var(--text2)">${o.items.map(i=>i.product.name).join(', ')}</div>
      <div style="font-size:17px;font-weight:800;margin-top:8px">${o.total.toLocaleString()} ₴</div>
    </div>
  `).join('');
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
