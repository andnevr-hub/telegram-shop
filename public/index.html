<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aki.Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.35.0/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --glass: rgba(28,28,30,0.55);
  --glass-strong: rgba(28,28,30,0.72);
  --glass-soft: rgba(255,255,255,0.08);
  --line: rgba(255,255,255,0.14);
  --line-soft: rgba(255,255,255,0.08);
  --text: #f5f5f7;
  --text2: rgba(245,245,247,0.62);
  --text3: rgba(245,245,247,0.38);
  --pink: #f5f5f7;
  --pink-dim: rgba(245,245,247,0.18);
  --blue: #f5f5f7;
  --blue-dim: rgba(245,245,247,0.18);
  --green: #f5f5f7;
  --green-dim: rgba(245,245,247,0.18);
  --red: #ff453a;
  --red-dim: rgba(255,69,58,0.18);
  --mice: #f5f5f7; --keyboards: #c7c7cc; --headphones: #8e8e93; --pads: #aeaeb2;
  --on-pink: #0a0a0a;
  --r-lg: 26px;
  --r-md: 18px;
  --r-sm: 13px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  --blur: 28px;
}
body.light {
  --glass: rgba(255,255,255,0.55);
  --glass-strong: rgba(255,255,255,0.75);
  --glass-soft: rgba(20,20,22,0.05);
  --line: rgba(20,20,22,0.1);
  --line-soft: rgba(20,20,22,0.06);
  --text: #1c1c1e;
  --text2: rgba(28,28,30,0.62);
  --text3: rgba(28,28,30,0.4);
  --pink: #1c1c1e;
  --pink-dim: rgba(28,28,30,0.12);
  --blue: #1c1c1e;
  --blue-dim: rgba(28,28,30,0.12);
  --green: #1c1c1e;
  --green-dim: rgba(28,28,30,0.12);
  --mice: #1c1c1e; --keyboards: #48484a; --headphones: #6e6e73; --pads: #8e8e93;
  --on-pink: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: #050505; }
body.light { background: #f5f5f7; }

body {
  font-family: var(--font);
  color: var(--text);
  min-height: 100vh; padding-bottom: 96px;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  position: relative;
}

/* ── GLASS BASE ── */
.glass {
  background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(1.6);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(1.6);
  border: 1px solid var(--line);
}

/* ── NAV ── */
.nav {
  position: fixed; bottom: 14px; left: 14px; right: 14px;
  background: var(--glass-strong);
  backdrop-filter: blur(34px) saturate(1.8);
  -webkit-backdrop-filter: blur(34px) saturate(1.8);
  border: 1px solid var(--line);
  border-radius: 24px;
  display: flex; z-index: 100;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 3px; padding: 12px 0 11px;
  cursor: pointer; font-size: 10.5px; font-weight: 600;
  color: var(--text3); border: none; background: none; font-family: var(--font);
  letter-spacing: 0.01em;
  transition: color .2s;
}
.nav-btn-icon-wrap {
  width: 38px; height: 26px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s;
}
.nav-btn.active .nav-btn-icon-wrap { background: var(--glass-soft); }
.nav-btn.active { color: var(--text); font-weight: 700; }
.nav-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }
.cart-badge {
  position: absolute; top: -5px; right: -8px;
  background: var(--pink); color: var(--on-pink);
  font-size: 9px; font-weight: 700; width: 16px; height: 16px;
  border-radius: 50%; display: none; align-items: center; justify-content: center;
  box-shadow: 0 0 0 2px var(--glass-strong);
}

/* ── PAGES ── */
.page { display: none; animation: fadeIn .25s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* ── HEADER ── */
.page-header {
  padding: 28px 18px 14px;
  display: flex; align-items: center; gap: 14px;
  justify-content: space-between;
}
.page-title-wrap { display: flex; align-items: center; gap: 12px; }
.page-back {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text); font-size: 17px; flex-shrink: 0;
}
.page-title {
  font-size: 28px; font-weight: 800;
  letter-spacing: -0.025em;
}

/* ── THEME BTN ── */
.theme-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}

/* ── SEARCH + CATS ── */
.search-wrap { padding: 4px 18px 14px; position: relative; display: flex; gap: 8px; align-items: center; }
.search-input {
  flex: 1; min-width: 0; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  border-radius: 18px; padding: 14px 16px 14px 44px; color: var(--text);
  font-size: 15px; outline: none; font-family: var(--font);
}
.search-icon {
  position: absolute; left: 36px; top: 50%; transform: translateY(-50%);
  color: var(--text3); pointer-events: none;
}
.search-input::placeholder { color: var(--text3); }
.filter-btn {
  flex-shrink: 0; width: 48px; height: 48px; border-radius: 16px;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line); color: var(--text); font-size: 19px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.filter-btn.active { background: var(--pink); color: var(--on-pink); border-color: var(--pink); }

.filter-panel {
  display: none; flex-direction: column; gap: 14px;
  margin: 0 18px 16px; padding: 16px;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line); border-radius: var(--r-md);
}
.filter-panel.open { display: flex; }
.filter-row { display: flex; flex-direction: column; gap: 8px; }
.filter-label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.04em; }
.filter-chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-chip {
  padding: 8px 14px; border-radius: 12px; font-size: 12.5px; font-weight: 600;
  background: var(--glass-soft); border: 1px solid var(--line); color: var(--text2);
  cursor: pointer; font-family: var(--font);
}
.filter-chip.active { background: var(--pink); color: var(--on-pink); border-color: var(--pink); }

.cats { display: flex; gap: 8px; padding: 0 18px 18px; overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat-btn {
  flex-shrink: 0; padding: 9px 16px; border-radius: 14px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  color: var(--text2); font-family: var(--font); white-space: nowrap;
  display: flex; align-items: center; gap: 7px;
  transition: background .2s, color .2s;
}
.cat-btn.active { background: var(--pink); border-color: var(--pink); color: var(--on-pink); }
.cat-dot { width: 6px; height: 6px; border-radius: 50%; }

/* ── PRODUCTS GRID ── */
.products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; padding: 0 18px; }
.product-card {
  background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(1.6);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(1.6);
  border-radius: var(--r-lg);
  overflow: hidden; cursor: pointer; position: relative;
  border: 1px solid var(--line);
  transition: transform .15s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}
.product-card:active { transform: scale(0.97); }
.product-img {
  width: 100%; aspect-ratio: 1; background: var(--glass-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 44px; position: relative; overflow: hidden;
}
.product-img img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
.stock-badge {
  position: absolute; top: 9px; right: 9px;
  font-size: 9.5px; font-weight: 700; padding: 5px 10px;
  border-radius: 20px; z-index: 2; letter-spacing: 0.02em;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.stock-badge.in { background: rgba(50,215,75,.25); color: #1a9e34; }
body.dark-mode .stock-badge.in, .stock-badge.in { color: #34d058; }
.stock-badge.out { background: rgba(255,69,58,.25); color: #ff453a; }
.photo-count {
  position: absolute; bottom: 9px; right: 9px;
  font-size: 9.5px; font-weight: 700; padding: 4px 8px;
  border-radius: 12px; z-index: 2; background: rgba(0,0,0,.35);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff;
  display: flex; align-items: center; gap: 3px;
}
.product-info { padding: 12px 13px 14px; }
.product-cat-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; margin-bottom: 5px; display: block;
}
.product-name {
  font-size: 13px; font-weight: 600; line-height: 1.35; margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: 35px;
}
.product-price { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
.add-btn {
  margin-top: 10px; width: 100%; background: var(--glass-soft);
  border: 1px solid var(--line-soft); border-radius: var(--r-sm); color: var(--text);
  font-size: 12.5px; font-weight: 600; padding: 10px;
  cursor: pointer; font-family: var(--font);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .15s;
}
.add-btn:active { background: var(--pink); color: var(--on-pink); border-color: var(--pink); }
.add-btn.disabled { color: var(--text3); pointer-events: none; }

/* ── DETAIL / CAROUSEL ── */
.detail-carousel {
  width: 100%; aspect-ratio: 1; position: relative; overflow: hidden;
  background: var(--glass-soft);
}
.detail-carousel-track {
  display: flex; height: 100%; transition: transform .35s cubic-bezier(.25,.8,.5,1);
}
.detail-carousel-slide {
  width: 100%; height: 100%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; position: relative;
}
.detail-carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
.carousel-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(0,0,0,.32); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center; color: #fff;
  cursor: pointer; z-index: 4; border: none; font-size: 16px;
}
.carousel-arrow.prev { left: 12px; }
.carousel-arrow.next { right: 12px; }
.carousel-dots {
  position: absolute; bottom: 14px; left: 0; right: 0;
  display: flex; justify-content: center; gap: 6px; z-index: 4;
}
.carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.45); transition: all .25s; }
.carousel-dot.active { background: #fff; width: 16px; border-radius: 3px; }

.detail-body { padding: 22px 18px 32px; }
.detail-cat-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.07em; margin-bottom: 8px; display: block;
}
.detail-name { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em; line-height: 1.25; }
.detail-price { font-size: 30px; font-weight: 800; margin-bottom: 18px; letter-spacing: -0.02em; }
.detail-desc { font-size: 14.5px; color: var(--text2); line-height: 1.7; margin-bottom: 22px; }
.detail-specs {
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-md);
  padding: 4px 16px; margin-bottom: 22px; border: 1px solid var(--line);
}
.spec-row {
  display: flex; justify-content: space-between;
  font-size: 13.5px; padding: 12px 0; border-bottom: 1px solid var(--line-soft);
}
.spec-row:last-child { border-bottom: none; }
.spec-label { color: var(--text2); }
.spec-val { font-weight: 600; }
.detail-add-btn {
  width: 100%; background: var(--pink); border: none;
  border-radius: 18px; color: var(--on-pink); font-size: 16px;
  font-weight: 700; padding: 17px; cursor: pointer; font-family: var(--font);
  box-shadow: 0 8px 28px var(--pink-dim);
}
.detail-add-btn.disabled { background: var(--glass-soft); color: var(--text3); box-shadow: none; }

/* ── EMPTY STATES ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 90px 24px; text-align: center; gap: 6px;
}
.empty-icon {
  width: 64px; height: 64px; border-radius: 20px; background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-bottom: 14px;
}
.empty-state h3 { font-size: 18px; font-weight: 700; }
.empty-state p { font-size: 13.5px; color: var(--text2); line-height: 1.6; max-width: 240px; }
.empty-btn {
  margin-top: 18px; padding: 13px 28px; background: var(--pink);
  border: none; border-radius: 16px; color: var(--on-pink);
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--font);
}

/* ── CART ── */
.cart-list { padding: 0 18px; display: flex; flex-direction: column; gap: 10px; }
.cart-item {
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-lg);
  padding: 13px; display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line);
}
.cart-item-icon {
  width: 58px; height: 58px; border-radius: 15px;
  background: var(--glass-soft); display: flex; align-items: center;
  justify-content: center; font-size: 28px; flex-shrink: 0; overflow: hidden;
}
.cart-item-icon img { width: 100%; height: 100%; object-fit: cover; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart-item-price { font-size: 15px; font-weight: 700; }
.cart-item-qty { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.qty-btn {
  width: 27px; height: 27px; border-radius: 9px;
  background: var(--glass-soft); border: 1px solid var(--line-soft); color: var(--text);
  font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.qty-num { font-size: 14px; font-weight: 700; min-width: 18px; text-align: center; }
.remove-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 17px; padding: 6px; }

.cart-footer { padding: 18px 18px; }
.cart-total {
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-lg);
  padding: 16px 18px; margin-bottom: 14px; border: 1px solid var(--line);
}
.cart-total-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 5px 0; color: var(--text2); }
.cart-total-row.total {
  font-size: 18px; font-weight: 800; color: var(--text);
  border-top: 1px solid var(--line-soft); margin-top: 10px; padding-top: 14px;
}
.checkout-btn {
  width: 100%; padding: 17px; background: var(--pink);
  border: none; border-radius: 18px; color: var(--on-pink);
  font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font);
  box-shadow: 0 8px 28px var(--pink-dim);
}

/* ── CHECKOUT STEPS ── */
.checkout-steps { display: flex; align-items: center; padding: 8px 18px 24px; }
.step-item { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
.step-circle {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  background: var(--glass-soft); color: var(--text3); border: 1px solid var(--line-soft);
}
.step-circle.active { background: var(--pink); color: var(--on-pink); border-color: var(--pink); }
.step-circle.done { background: var(--green); color: #06280c; border-color: var(--green); }
.step-label { font-size: 9.5px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.step-label.active { color: var(--text); }
.step-line { flex: 1; height: 1px; background: var(--line-soft); margin: 0 4px 18px; }

.checkout-form { padding: 0 18px; display: flex; flex-direction: column; gap: 13px; }
.form-label { font-size: 11.5px; color: var(--text2); margin-bottom: -6px; padding-left: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.form-input {
  width: 100%; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  border-radius: 16px; padding: 15px 16px; color: var(--text);
  font-size: 15px; outline: none; font-family: var(--font);
}
.form-input::placeholder { color: var(--text3); }

.delivery-option {
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 16px;
  cursor: pointer; display: flex; align-items: center; gap: 13px;
}
.delivery-option.selected { border-color: var(--pink); }
.delivery-opt-icon {
  width: 42px; height: 42px; border-radius: 13px; background: var(--glass-soft);
  display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0;
  color: var(--text);
}
.delivery-opt-info { flex: 1; }
.delivery-opt-name { font-size: 14.5px; font-weight: 600; }
.delivery-opt-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }
.radio { width: 19px; height: 19px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.radio.checked { border-color: var(--pink); background: var(--pink); }
.radio.checked::after { content:''; width: 6px; height: 6px; border-radius: 50%; background: #fff; }

.next-btn {
  width: 100%; padding: 17px; background: var(--pink);
  border: none; border-radius: 18px; color: var(--on-pink);
  font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font); margin-top: 8px;
  box-shadow: 0 8px 28px var(--pink-dim);
}
.checkout-nav-row { display: flex; gap: 10px; margin-top: 8px; }
.checkout-nav-row .next-btn { margin-top: 0; flex: 1; }
.back-btn {
  flex: 0 0 auto; padding: 17px 20px; background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line); border-radius: 18px; color: var(--text);
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font);
}

/* ── SUCCESS ── */
.success-page {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 56vh; padding: 40px 24px;
  text-align: center; gap: 8px;
}
.success-icon {
  width: 78px; height: 78px; border-radius: 24px;
  background: var(--green-dim); display: flex; align-items: center; justify-content: center;
  font-size: 36px; margin-bottom: 8px;
  animation: pop .45s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes pop { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
.success-title { font-size: 24px; font-weight: 800; }
.success-desc { font-size: 14px; color: var(--text2); line-height: 1.7; }
.success-btn {
  padding: 14px 30px; background: var(--pink); border: none;
  border-radius: 16px; color: var(--on-pink); font-size: 14.5px; font-weight: 700;
  cursor: pointer; font-family: var(--font); margin-top: 14px;
}

/* ── ACCOUNT ── */
.account-card {
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-lg);
  padding: 18px; display: flex; align-items: center; gap: 15px;
  border: 1px solid var(--line); margin-bottom: 26px;
}
.account-avatar {
  width: 50px; height: 50px; border-radius: 16px; background: var(--pink);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; color: var(--on-pink); flex-shrink: 0;
}
.section-label {
  font-size: 11px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; padding-left: 2px;
}
.order-card {
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-lg);
  padding: 16px 17px; margin-bottom: 10px; border: 1px solid var(--line);
}

/* ── TOAST ── */
.toast {
  position: fixed; top: 22px; left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--glass-strong); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--line); color: var(--text);
  padding: 11px 22px; border-radius: 30px;
  font-size: 13px; font-weight: 600;
  transition: transform .3s cubic-bezier(.175,.885,.32,1.275);
  z-index: 999; white-space: nowrap; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── SKELETON ── */
.skeleton {
  background: linear-gradient(90deg, var(--glass-soft) 25%, var(--line-soft) 50%, var(--glass-soft) 75%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 12px;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- SHOP -->
<div class="page active" id="page-shop">
  <div class="page-header">
    <span class="page-title">Магазин</span>
    <button class="theme-btn" id="theme-btn"><i class="ti ti-moon"></i></button>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input class="search-input" type="text" id="search-input" placeholder="Пошук товарів…" oninput="filterProducts()">
    <button class="filter-btn" id="filter-btn" onclick="toggleFilterPanel()"><i class="ti ti-adjustments-horizontal"></i></button>
  </div>
  <div class="filter-panel" id="filter-panel">
    <div class="filter-row">
      <span class="filter-label">Сортування за ціною</span>
      <div class="filter-chip-group">
        <button class="filter-chip active" data-sort="none" onclick="setSortOrder('none')">Без сортування</button>
        <button class="filter-chip" data-sort="asc" onclick="setSortOrder('asc')">Дешевші спершу</button>
        <button class="filter-chip" data-sort="desc" onclick="setSortOrder('desc')">Дорожчі спершу</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Наявність</span>
      <div class="filter-chip-group">
        <button class="filter-chip active" data-stock="all" onclick="setStockFilter('all')">Усі товари</button>
        <button class="filter-chip" data-stock="in" onclick="setStockFilter('in')">Лише в наявності</button>
      </div>
    </div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="products-grid" id="products-grid">
    <div class="glass" style="border-radius:26px;overflow:hidden">
      <div class="skeleton" style="aspect-ratio:1;width:100%"></div>
      <div style="padding:13px"><div class="skeleton" style="height:13px;margin-bottom:8px"></div><div class="skeleton" style="height:17px;width:55%"></div></div>
    </div>
    <div class="glass" style="border-radius:26px;overflow:hidden">
      <div class="skeleton" style="aspect-ratio:1;width:100%"></div>
      <div style="padding:13px"><div class="skeleton" style="height:13px;margin-bottom:8px"></div><div class="skeleton" style="height:17px;width:55%"></div></div>
    </div>
  </div>
</div>

<!-- DETAIL -->
<div class="page" id="page-detail">
  <div class="page-header">
    <button class="page-back" onclick="goBack()">←</button>
    <div></div>
  </div>
  <div class="detail-carousel" id="detail-carousel"></div>
  <div class="detail-body">
    <span class="detail-cat-label" id="detail-cat-label"></span>
    <div class="detail-name" id="detail-name"></div>
    <div class="detail-price" id="detail-price"></div>
    <div class="detail-desc" id="detail-desc"></div>
    <div class="detail-specs" id="detail-specs"></div>
    <button class="detail-add-btn" id="detail-add-btn" onclick="addFromDetail()">Додати в кошик</button>
  </div>
</div>

<!-- CART -->
<div class="page" id="page-cart">
  <div class="page-header"><span class="page-title">Кошик</span><div></div></div>
  <div id="cart-content"></div>
</div>

<!-- CHECKOUT -->
<div class="page" id="page-checkout">
  <div class="page-header">
    <button class="page-back" onclick="showPage('cart')">←</button>
    <span class="page-title" style="font-size:22px">Оформлення</span>
  </div>
  <div class="checkout-steps">
    <div class="step-item"><div class="step-circle active" id="step1">1</div><div class="step-label active">Контакти</div></div>
    <div class="step-line"></div>
    <div class="step-item"><div class="step-circle" id="step2">2</div><div class="step-label">Доставка</div></div>
    <div class="step-line"></div>
    <div class="step-item"><div class="step-circle" id="step3">3</div><div class="step-label">Оплата</div></div>
    <div class="step-line"></div>
    <div class="step-item"><div class="step-circle" id="step4">4</div><div class="step-label">Готово</div></div>
  </div>
  <div id="checkout-body"></div>
</div>

<!-- ACCOUNT -->
<div class="page" id="page-account">
  <div class="page-header"><span class="page-title">Профіль</span><div></div></div>
  <div style="padding:0 18px">
    <div class="account-card">
      <div class="account-avatar" id="account-avatar">А</div>
      <div>
        <div style="font-size:16px;font-weight:700" id="account-name">Гість</div>
        <div style="font-size:12.5px;color:var(--text2)" id="account-username">@username</div>
      </div>
    </div>
    <div class="section-label">Мої замовлення</div>
    <div id="orders-list">
      <div class="empty-state" style="padding:60px 20px">
        <div class="empty-icon"><i class="ti ti-package"></i></div>
        <h3>Замовлень немає</h3>
        <p>Оформіть перше замовлення і воно з'явиться тут</p>
      </div>
    </div>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" id="nav-shop" onclick="showPage('shop')">
    <div class="nav-btn-icon-wrap"><i class="ti ti-building-store" style="font-size:21px"></i></div>
    Магазин
  </button>
  <button class="nav-btn" id="nav-cart" onclick="showPage('cart')">
    <div class="nav-btn-icon-wrap" style="position:relative">
      <i class="ti ti-shopping-cart" style="font-size:21px"></i>
      <div class="cart-badge" id="cart-badge">0</div>
    </div>
    Кошик
  </button>
  <button class="nav-btn" id="nav-account" onclick="showPage('account')">
    <div class="nav-btn-icon-wrap"><i class="ti ti-user" style="font-size:21px"></i></div>
    Профіль
  </button>
</nav>

<script>
const API = window.location.origin;

const CATS = [
  { id:'all', label:'Все', color: null, icon: null },
  { id:'mice', label:'Мишки', color: 'var(--mice)', icon: 'ti-mouse-2' },
  { id:'keyboards', label:'Клавіатури', color: 'var(--keyboards)', icon: 'ti-keyboard' },
  { id:'headphones', label:'Навушники', color: 'var(--headphones)', icon: 'ti-headphones' },
  { id:'pads', label:'Килимки', color: 'var(--pads)', icon: 'ti-square' },
];

let products = [];
let currentCat = 'all';
let currentPage = 'shop';
let prevPage = 'shop';
let currentProduct = null;
let cart = {};
let checkoutStep = 1;
let checkoutData = {};
let orders = [];
let carouselIndex = 0;
let telegramId = null;
let sortOrder = 'none';
let stockFilter = 'all';

// ── THEME ──
const themeBtn = document.getElementById('theme-btn');
if (localStorage.getItem('theme') === 'light') {
  document.body.classList.add('light');
  themeBtn.innerHTML = '<i class="ti ti-sun"></i>';
}
themeBtn.onclick = () => {
  document.body.classList.toggle('light');
  const light = document.body.classList.contains('light');
  localStorage.setItem('theme', light ? 'light' : 'dark');
  themeBtn.innerHTML = light ? '<i class="ti ti-sun"></i>' : '<i class="ti ti-moon"></i>';
};

// ── INIT ──
window.onload = async () => {
  if (window.Telegram?.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.expand();
    const u = tg.initDataUnsafe?.user;
    if (u) {
      telegramId = u.id;
      document.getElementById('account-name').textContent = u.first_name + (u.last_name ? ' ' + u.last_name : '');
      document.getElementById('account-username').textContent = '@' + (u.username || 'username');
      document.getElementById('account-avatar').textContent = u.first_name[0];
    }
  }
  renderCats();
  await loadProducts();
};

async function loadProducts() {
  try {
    const res = await fetch(`${API}/api/products`);
    products = await res.json();
    renderProducts();
  } catch(e) {
    document.getElementById('products-grid').innerHTML = `
      <div style="grid-column:1/-1" class="empty-state">
        <div class="empty-icon"><i class="ti ti-alert-triangle"></i></div>
        <h3>Помилка завантаження</h3>
        <p>Перевір підключення до інтернету</p>
      </div>`;
  }
}

function getPhotos(p) {
  // Підтримка кількох фото: масив photos[] або одне фото photo
  if (Array.isArray(p.photos) && p.photos.length) return p.photos;
  if (p.photo) return [p.photo];
  return [];
}

function showPage(name) {
  haptic();
  prevPage = currentPage;
  currentPage = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const navMap = { shop:'nav-shop', cart:'nav-cart', account:'nav-account' };
  if (navMap[name]) document.getElementById(navMap[name]).classList.add('active');
  if (name === 'cart') renderCart();
  if (name === 'account') loadOrders();
  window.scrollTo(0, 0);
}
function goBack() { showPage(prevPage === 'cart' ? 'shop' : (prevPage || 'shop')); }

function catColor(cat) { return CATS.find(x => x.id === cat)?.color || 'var(--pink)'; }
function catLabel(cat) { return CATS.find(x => x.id === cat)?.label || cat; }
function iconForCat(cat) { return CATS.find(x => x.id === cat)?.icon || 'ti-package'; }

function renderCats() {
  document.getElementById('cats').innerHTML = CATS.map(c => `
    <button class="cat-btn ${c.id === currentCat ? 'active' : ''}" onclick="selectCat('${c.id}')">
      ${c.icon ? `<i class="ti ${c.icon}" style="font-size:15px" aria-hidden="true"></i>` : ''}${c.label}
    </button>
  `).join('');
}
function selectCat(id) { haptic(); currentCat = id; renderCats(); renderProducts(); }

function imgTag(photo, icon, size) {
  if (photo) return `<img src="${photo}" alt="" loading="lazy">`;
  return `<i class="ti ${icon || 'ti-package'}" style="font-size:${size || '34px'};color:var(--text3)" aria-hidden="true"></i>`;
}

function renderProducts() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const grid = document.getElementById('products-grid');
  let filtered = products.filter(p =>
    (currentCat === 'all' || p.category === currentCat) &&
    p.name.toLowerCase().includes(q) &&
    (stockFilter === 'all' || p.stock > 0)
  );
  if (sortOrder === 'asc') filtered = filtered.slice().sort((a,b) => a.price - b.price);
  else if (sortOrder === 'desc') filtered = filtered.slice().sort((a,b) => b.price - a.price);
  if (!filtered.length) {
    grid.innerHTML = `<div style="grid-column:1/-1" class="empty-state"><div class="empty-icon">⌕</div><h3>Нічого не знайдено</h3></div>`;
    return;
  }
  grid.innerHTML = filtered.map((p) => {
    const photos = getPhotos(p);
    return `
    <div class="product-card" onclick="openProduct(${p.id})">
      <div class="product-img">
        ${imgTag(photos[0], iconForCat(p.category))}
        <span class="stock-badge ${p.stock > 0 ? 'in' : 'out'}">${p.stock > 0 ? `В наявності: ${p.stock}` : 'Немає'}</span>
        ${photos.length > 1 ? `<span class="photo-count"><i class="ti ti-photo"></i> ${photos.length}</span>` : ''}
      </div>
      <div class="product-info">
        <span class="product-cat-label" style="color:${catColor(p.category)}">${catLabel(p.category)}</span>
        <div class="product-name">${p.name}</div>
        <div class="product-price">${Number(p.price).toLocaleString()} ₴</div>
        <button class="add-btn ${p.stock === 0 ? 'disabled' : ''}" onclick="event.stopPropagation();addToCart(${p.id})">В кошик</button>
      </div>
    </div>
  `}).join('');
}
function filterProducts() { renderProducts(); }

function toggleFilterPanel() {
  haptic();
  const panel = document.getElementById('filter-panel');
  const btn = document.getElementById('filter-btn');
  panel.classList.toggle('open');
  btn.classList.toggle('active', panel.classList.contains('open'));
}
function setSortOrder(v) {
  haptic();
  sortOrder = v;
  document.querySelectorAll('[data-sort]').forEach(el => el.classList.toggle('active', el.dataset.sort === v));
  renderProducts();
}
function setStockFilter(v) {
  haptic();
  stockFilter = v;
  document.querySelectorAll('[data-stock]').forEach(el => el.classList.toggle('active', el.dataset.stock === v));
  renderProducts();
}

function renderCarousel(photos) {
  carouselIndex = 0;
  const el = document.getElementById('detail-carousel');
  if (!photos.length) {
    el.innerHTML = `<div class="detail-carousel-slide" style="display:flex;align-items:center;justify-content:center"><i class="ti ${iconForCat(currentProduct.category)}" style="font-size:72px;color:var(--text3)"></i></div>`;
    return;
  }
  el.innerHTML = `
    <div class="detail-carousel-track" id="carousel-track" style="width:${photos.length * 100}%">
      ${photos.map(src => `<div class="detail-carousel-slide" style="width:${100/photos.length}%"><img src="${src}" alt=""></div>`).join('')}
    </div>
    ${photos.length > 1 ? `
      <button class="carousel-arrow prev" onclick="carouselMove(-1)">‹</button>
      <button class="carousel-arrow next" onclick="carouselMove(1)">›</button>
      <div class="carousel-dots">${photos.map((_,i) => `<div class="carousel-dot ${i===0?'active':''}" data-i="${i}"></div>`).join('')}</div>
    ` : ''}
  `;
  el.dataset.count = photos.length;
}
function carouselMove(dir) {
  const count = parseInt(document.getElementById('detail-carousel').dataset.count || '1');
  carouselIndex = Math.max(0, Math.min(count - 1, carouselIndex + dir));
  updateCarousel();
}
function updateCarousel() {
  const track = document.getElementById('carousel-track');
  if (!track) return;
  const count = parseInt(document.getElementById('detail-carousel').dataset.count || '1');
  track.style.transform = `translateX(-${carouselIndex * (100/count)}%)`;
  document.querySelectorAll('.carousel-dot').forEach((d,i) => d.classList.toggle('active', i === carouselIndex));
}

let touchStartX = 0;
document.addEventListener('touchstart', e => {
  if (e.target.closest('.detail-carousel')) touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchend', e => {
  if (e.target.closest('.detail-carousel') && touchStartX) {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) carouselMove(dx < 0 ? 1 : -1);
    touchStartX = 0;
  }
});

function openProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  currentProduct = p;
  prevPage = currentPage;
  const specs = typeof p.specs === 'string' ? JSON.parse(p.specs) : (p.specs || []);
  renderCarousel(getPhotos(p));
  document.getElementById('detail-cat-label').textContent = catLabel(p.category);
  document.getElementById('detail-cat-label').style.color = catColor(p.category);
  document.getElementById('detail-name').textContent = p.name;
  document.getElementById('detail-price').textContent = Number(p.price).toLocaleString() + ' ₴';
  document.getElementById('detail-desc').textContent = p.description || '';
  document.getElementById('detail-specs').innerHTML = specs.map(([l,v]) => `
    <div class="spec-row"><span class="spec-label">${l}</span><span class="spec-val">${v}</span></div>
  `).join('') || '';
  const btn = document.getElementById('detail-add-btn');
  btn.className = 'detail-add-btn' + (p.stock === 0 ? ' disabled' : '');
  btn.textContent = p.stock > 0 ? 'Додати в кошик' : 'Немає в наявності';
  showPage('detail');
}
function addFromDetail() { if (currentProduct && currentProduct.stock > 0) addToCart(currentProduct.id); }

function addToCart(id) {
  const p = products.find(x => x.id === id);
  if (!p || p.stock === 0) return;
  if (cart[id]) cart[id].qty = Math.min(cart[id].qty + 1, p.stock);
  else cart[id] = { product: p, qty: 1 };
  updateBadge();
  showToast('✓ Додано до кошика');
  haptic();
}
function removeFromCart(id) { haptic(); delete cart[id]; updateBadge(); renderCart(); }
function changeQty(id, d) {
  if (!cart[id]) return;
  const p = products.find(x => x.id === id);
  const max = p ? p.stock : 999;
  const newQty = cart[id].qty + d;
  if (d > 0 && newQty > max) { showToast(`Доступно лише ${max} шт.`); return; }
  haptic();
  cart[id].qty = newQty;
  if (cart[id].qty <= 0) delete cart[id];
  updateBadge(); renderCart();
}
function updateBadge() {
  const n = Object.values(cart).reduce((s,i) => s+i.qty, 0);
  const b = document.getElementById('cart-badge');
  b.textContent = n; b.style.display = n > 0 ? 'flex' : 'none';
}
function cartTotal() { return Object.values(cart).reduce((s,i) => s + i.product.price * i.qty, 0); }

function renderCart() {
  const el = document.getElementById('cart-content');
  const items = Object.values(cart);
  if (!items.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon"><i class="ti ti-shopping-cart"></i></div>
      <h3>Кошик порожній</h3>
      <p>Додайте товари з каталогу</p>
      <button class="empty-btn" onclick="showPage('shop')">В каталог</button>
    </div>`;
    return;
  }
  const list = items.map(i => `
    <div class="cart-item">
      <div class="cart-item-icon">${imgTag(getPhotos(i.product)[0], iconForCat(i.product.category), '26px')}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${i.product.name}</div>
        <div class="cart-item-price">${(i.product.price * i.qty).toLocaleString()} ₴</div>
        <div class="cart-item-qty">
          <button class="qty-btn" onclick="changeQty(${i.product.id},-1)">−</button>
          <span class="qty-num">${i.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i.product.id},1)">+</button>
        </div>
      </div>
      <button class="remove-btn" onclick="removeFromCart(${i.product.id})"><i class="ti ti-x"></i></button>
    </div>
  `).join('');
  const total = cartTotal();
  el.innerHTML = `
    <div class="cart-list">${list}</div>
    <div class="cart-footer">
      <div class="cart-total">
        <div class="cart-total-row"><span>Товари (${items.length})</span><span>${total.toLocaleString()} ₴</span></div>
        <div class="cart-total-row"><span>Доставка</span><span>за тарифом НП</span></div>
        <div class="cart-total-row total"><span>Разом</span><span>${total.toLocaleString()} ₴</span></div>
      </div>
      <button class="checkout-btn" onclick="startCheckout()">Оформити замовлення →</button>
    </div>`;
}

function startCheckout() { checkoutStep = 1; checkoutData = {}; showPage('checkout'); renderCheckoutStep(); }
function setStep(n) {
  for (let i=1;i<=4;i++) {
    const c = document.getElementById('step'+i);
    c.className = 'step-circle' + (i<n?' done':i===n?' active':'');
  }
  document.querySelectorAll('.step-label').forEach((l,i) => { l.className = 'step-label' + (i+1===n?' active':''); });
}
function renderCheckoutStep() {
  setStep(checkoutStep);
  const el = document.getElementById('checkout-body');
  if (checkoutStep === 1) {
    el.innerHTML = `<div class="checkout-form">
      <div class="form-label">Ім'я та прізвище</div>
      <input class="form-input" id="inp-name" placeholder="Іван Іваненко" value="${checkoutData.name||''}">
      <div class="form-label">Номер телефону</div>
      <input class="form-input" id="inp-phone" placeholder="+380 00 000 0000" type="tel" value="${checkoutData.phone||''}">
      <div class="checkout-nav-row">
        <button class="back-btn" onclick="showPage('cart')">← Назад</button>
        <button class="next-btn" onclick="nextStep1()">Далі →</button>
      </div>
    </div>`;
  } else if (checkoutStep === 2) {
    el.innerHTML = `<div class="checkout-form">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="delivery-option ${checkoutData.delivery==='np'?'selected':''}" onclick="selectDelivery('np')">
          <div class="delivery-opt-icon"><i class="ti ti-package"></i></div>
          <div class="delivery-opt-info"><div class="delivery-opt-name">Nova Poshta</div><div class="delivery-opt-desc">По всій Україні, 1-3 дні</div></div>
          <div class="radio ${checkoutData.delivery==='np'?'checked':''}"></div>
        </div>
        <div class="delivery-option ${checkoutData.delivery==='pickup'?'selected':''}" onclick="selectDelivery('pickup')">
          <div class="delivery-opt-icon"><i class="ti ti-home"></i></div>
          <div class="delivery-opt-info"><div class="delivery-opt-name">Самовивіз</div><div class="delivery-opt-desc">Київ, уточнення при замовленні</div></div>
          <div class="radio ${checkoutData.delivery==='pickup'?'checked':''}"></div>
        </div>
      </div>
      ${checkoutData.delivery==='np'?`
        <div class="form-label">Область</div>
        <input class="form-input" id="inp-region" placeholder="Київська область" value="${checkoutData.region||''}">
        <div class="form-label">Місто</div>
        <input class="form-input" id="inp-city" placeholder="Київ" value="${checkoutData.city||''}">
        <div class="form-label">Відділення або поштомат</div>
        <input class="form-input" id="inp-branch" placeholder="Відділення №1" value="${checkoutData.branch||''}">
      `:''}
      <div class="checkout-nav-row">
        <button class="back-btn" onclick="prevStep()">← Назад</button>
        <button class="next-btn" onclick="nextStep2()">Далі →</button>
      </div>
    </div>`;
  } else if (checkoutStep === 3) {
    el.innerHTML = `<div class="checkout-form">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="delivery-option ${checkoutData.payment==='card'?'selected':''}" onclick="selectPayment('card')">
          <div class="delivery-opt-icon"><i class="ti ti-credit-card"></i></div>
          <div class="delivery-opt-info"><div class="delivery-opt-name">Карта (передоплата)</div><div class="delivery-opt-desc">PrivatBank / Monobank</div></div>
          <div class="radio ${checkoutData.payment==='card'?'checked':''}"></div>
        </div>
        <div class="delivery-option ${checkoutData.payment==='cod'?'selected':''}" onclick="selectPayment('cod')">
          <div class="delivery-opt-icon"><i class="ti ti-truck-delivery"></i></div>
          <div class="delivery-opt-info"><div class="delivery-opt-name">Накладений платіж</div><div class="delivery-opt-desc">+2% комісія НП при отриманні</div></div>
          <div class="radio ${checkoutData.payment==='cod'?'checked':''}"></div>
        </div>
      </div>
      <div class="checkout-nav-row">
        <button class="back-btn" onclick="prevStep()">← Назад</button>
        <button class="next-btn" onclick="nextStep3()">Підтвердити замовлення ✓</button>
      </div>
    </div>`;
  } else if (checkoutStep === 4) {
    placeOrder();
  }
}

async function placeOrder() {
  const items = Object.values(cart).map(i => ({ id: i.product.id, name: i.product.name, price: i.product.price, qty: i.qty }));
  try {
    const res = await fetch(`${API}/api/orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: checkoutData.name, phone: checkoutData.phone, delivery: checkoutData.delivery, region: checkoutData.region, city: checkoutData.city, branch: checkoutData.branch, payment: checkoutData.payment, items, total: cartTotal(), telegramId })
    });
    const data = await res.json();
    if (!data.success) throw new Error();
    const orderNum = data.orderNum;
    cart = {}; updateBadge();
    loadOrders();
    setStep(4);
    document.getElementById('checkout-body').innerHTML = `
      <div class="success-page">
        <div class="success-icon">✓</div>
        <div class="success-title">Замовлення оформлено</div>
        <div class="success-desc">Номер: <strong>${orderNum}</strong><br><br>Менеджер зв'яжеться з вами найближчим часом для підтвердження.</div>
        <button class="success-btn" onclick="showPage('shop')">Продовжити покупки</button>
      </div>`;
    if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
  } catch(e) {
    showToast('✕ Помилка. Спробуй ще раз');
    checkoutStep = 3; renderCheckoutStep();
  }
}

function nextStep1() {
  const name = document.getElementById('inp-name').value.trim();
  const phone = document.getElementById('inp-phone').value.trim();
  if (!name || !phone) { showToast('Заповніть всі поля'); return; }
  const digits = phone.replace(/\D/g, '');
  const isValid = /^0\d{9}$/.test(digits) || /^380\d{9}$/.test(digits);
  if (!isValid) { showToast('Введіть повний номер телефону (10 цифр), напр. 0991234567'); return; }
  haptic();
  checkoutData.name = name; checkoutData.phone = phone;
  checkoutStep = 2; renderCheckoutStep();
}
function prevStep() {
  haptic();
  // Зберігаємо те, що людина встигла ввести на поточному кроці, перед поверненням назад
  if (checkoutStep === 2) {
    checkoutData.region = document.getElementById('inp-region')?.value.trim() ?? checkoutData.region;
    checkoutData.city = document.getElementById('inp-city')?.value.trim() ?? checkoutData.city;
    checkoutData.branch = document.getElementById('inp-branch')?.value.trim() ?? checkoutData.branch;
  }
  checkoutStep = Math.max(1, checkoutStep - 1);
  renderCheckoutStep();
}
function nextStep2() {
  if (!checkoutData.delivery) { showToast('Оберіть спосіб доставки'); return; }
  if (checkoutData.delivery === 'np') {
    checkoutData.region = document.getElementById('inp-region')?.value.trim();
    checkoutData.city = document.getElementById('inp-city')?.value.trim();
    checkoutData.branch = document.getElementById('inp-branch')?.value.trim();
    if (!checkoutData.region || !checkoutData.city || !checkoutData.branch) { showToast('Вкажіть область, місто і відділення'); return; }
  }
  haptic();
  checkoutStep = 3; renderCheckoutStep();
}
function nextStep3() {
  if (!checkoutData.payment) { showToast('Оберіть спосіб оплати'); return; }
  haptic();
  checkoutStep = 4; renderCheckoutStep();
}
function selectDelivery(t) { haptic(); checkoutData.delivery = t; renderCheckoutStep(); }
function selectPayment(t) { haptic(); checkoutData.payment = t; renderCheckoutStep(); }

const STATUS_LABELS = {
  new: { text: 'Нове', color: 'var(--text2)' },
  confirmed: { text: 'Підтверджено', color: 'var(--blue)' },
  shipped: { text: 'Відправлено', color: 'var(--blue)' },
  done: { text: 'Виконано', color: 'var(--green)' },
  cancelled: { text: 'Скасовано', color: 'var(--red)' }
};

async function loadOrders() {
  if (!telegramId) { renderOrders(); return; }
  try {
    const res = await fetch(`${API}/api/orders?telegramId=${telegramId}`);
    orders = await res.json();
  } catch(e) {
    orders = [];
  }
  renderOrders();
}

function renderOrders() {
  const el = document.getElementById('orders-list');
  if (!orders.length) {
    el.innerHTML = `<div class="empty-state" style="padding:60px 20px">
      <div class="empty-icon"><i class="ti ti-package"></i></div>
      <h3>Замовлень немає</h3>
      <p>Оформіть перше замовлення з каталогу</p>
      <button class="empty-btn" onclick="showPage('shop')">До каталогу</button>
    </div>`;
    return;
  }
  el.innerHTML = orders.map(o => {
    const st = STATUS_LABELS[o.status] || STATUS_LABELS.new;
    return `
    <div class="order-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-weight:700">${o.order_num}</span>
        <span style="font-size:11.5px;color:${st.color};font-weight:600">${st.text}</span>
      </div>
      <div style="font-size:12.5px;color:var(--text2)">${(o.items||[]).map(i=>i.name).join(', ')}</div>
      <div style="font-size:17px;font-weight:800;margin-top:8px">${Number(o.total).toLocaleString()} ₴</div>
    </div>
  `;
  }).join('');
}

function haptic(style) {
  if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred(style || 'light');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
